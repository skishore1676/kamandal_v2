# Agent Broker owns execution and metering. This repository assigns actors.
# Source interpretation uses the bounded multimodal profile validated on the
# operator corpus and historical holdout. Other actors keep the balanced brain.
# Host-wide routing may override repository assignments: deploy the exact
# kamandal/source_episode_interpreter route with configure_source_interpreter.py.
schema: agent_broker.policy.v1
profiles:
  source_interpreter:
    provider: codex
    options:
      model: gpt-6-astra
      reasoning_effort: low
      verbosity: low
      sandbox: read-only
      approval_policy: never
      ignore_user_config: true
      ephemeral: true
    allowed_tools: []
lanes:
  kamandal:
    actors:
      thesis_extractor: {brain: balanced}
      observed_package_extractor: {brain: balanced}
      source_episode_interpreter: {profile: source_interpreter}
      rejection_reviewer: {brain: balanced}

  kamandal_evaluation:
    actors:
      source_episode_interpreter: {profile: source_interpreter}
