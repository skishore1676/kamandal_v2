# Kamandal's brain assignment — the only agent-broker config this repo carries.
# Actor -> named brain; the brain's models live centrally in
# ~/.agent-broker/brains.yaml. Kamandal previously ran on codex ALONE, which is
# why the 2026-07-01 codex outage killed its extraction. Both actors now use the
# `balanced` brain (sonnet -> haiku -> codex): a capable primary with real
# failover, and codex retained as the last tier. Extraction/review of trading
# ideas is routine synthesis, not frontier judgment -> balanced, not default.
# (thesis_extractor could move to `bulk` for free-first once you sign off; kept
# conservative here — no free model on a trading path without review.)
#
# ACTIVATION (deliberately NOT flipped): config/control.yaml pins
# `llm.provider: codex_cli`, so the production path still uses the legacy single
# Codex client. To activate the broker (failover + brains), set
# `llm.provider: agent_broker` (or remove the pin) in control.yaml. That changes
# the primary model codex -> sonnet (codex retained as the last failover tier) —
# a trading behavior change, hence gated on explicit sign-off. Rollback = one line.
schema: agent_broker.policy.v1
lanes:
  kamandal:
    actors:
      thesis_extractor: {brain: balanced}
      rejection_reviewer: {brain: balanced}
