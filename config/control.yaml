runtime:
  mode: live                   # shadow | live
  trading_enabled: true
  halt: false
  market_timezone: America/Chicago

portfolio:
  target_max_bpr_utilization_pct: 55
  hard_max_bpr_utilization_pct: 55
  max_bpr_per_underlying_pct: 55
  max_positions: 15
  delta_bias: slightly_negative
  delta_guard:
    enabled: true
    mode: relaxed
    apply_modes: [live]
    allow_improvement_when_outside: true
    modes:
      relaxed:
        min_delta: -2.5
        max_delta: 0.5
      balanced:
        min_delta: -2.0
        max_delta: 0.0
      strict:
        min_delta: -1.5
        max_delta: -0.25
  gamma_policy: record_and_research
  theta_policy: positive_theta_preferred
  vega_policy: record_only

risk_manager:
  # Portfolio-level circuit breakers for NEW live entries (exits are never blocked).
  # YAML stays conservative; oldmac may explicitly enable via KAMANDAL_RISK_MANAGER_ENABLED.
  # Operator reconfirmed the enabled runtime posture and the +1 concentration-cap
  # expansion on 2026-08-08 to support deliberate buying-power growth.
  enabled: false
  max_account_snapshot_age_minutes: 1440 # block new entries if account truth is older than one day
  max_daily_drawdown_pct: 4.0        # rolling 1d peak-to-latest account_size drop; deposits/withdrawals distort
  max_weekly_drawdown_pct: 7.0       # rolling 7d peak-to-latest
  consecutive_loss_limit: 4          # N losing closes in a row pauses entries...
  cooldown_days: 2                   # ...for this many days after the last losing close
  max_new_positions_per_day: 4       # position groups opened per configured market day
  max_positions_per_underlying: 3    # repeated same-symbol groups; existing excess is not force-closed
  max_positions_by_cluster:          # new-entry caps; exits are never blocked
    megacap_tech: 5
    semis: 4
    broad_index: 3
    crypto_adjacent: 3
  correlation_clusters:
    semis: [NVDA, AMD, MRVL, AVGO, MU, TSM, SMCI, DELL, INTC, QCOM]
    megacap_tech: [AAPL, MSFT, GOOGL, AMZN, META, NFLX, TSLA, CRM, NOW, ORCL, PLTR]
    broad_index: [SPY, QQQ, IWM, DIA]
    crypto_adjacent: [COIN, MSTR, HOOD]

shadow:
  account_size_override: 20000
  buying_power_override: 20000
  bpr_used_override: 0
  max_positions_override: 60
  max_new_positions_per_plan: 4
  max_new_plans_per_day: 5
  basket:
    # Shadow records estimated/dry-run BPR but never treats synthetic account
    # capacity as an admission or basket-sizing veto. Live keeps its own caps.
    min_marginal_score: 2
    max_new_positions_per_plan: 4
  idea_cooldown_days: 1
  match_gate_mode: permissive # strict | permissive
  candidate_filter_mode: warn   # strict | warn

live:
  entry_approval_mode: auto_top_plan  # sheet_approval | auto_top_plan | disabled
  exit_approval_mode: auto_rules      # sheet_approval | auto_rules | disabled
  auto_submit_entries: true
  auto_submit_exits: true
  match_gate_mode: strict
  candidate_filter_mode: strict
  mentioned_strategy_policy: soft # soft | strict
  min_entry_legs: 2
  max_new_positions_per_plan: 3
  max_orders_per_plan: 3
  max_live_entry_submits_per_run: 3
  exit_submit_source: sheet # sheet | ledger
  max_close_submits_per_run: 10
  max_new_plans_per_day: 3
  max_live_baskets_per_day: 3
  plan_fallback:
    enabled: true                   # operator-approved 2026-08-21 canary; at most one fresh Plan-2 replan
    max_attempts: 2
    auto_submit: true
  option_submission:
    # The broker-facing guard is authoritative; launchd timing is only a wake-up schedule.
    enabled: true
    market_open_time: "08:30"
    entry_not_before_time: "09:00"
    regular_close_time: "15:00"
    extended_close_time: "15:15"
    extended_close_symbols: [SPY]
    quote_max_age_minutes: 10       # package observations older than this cannot drive management
    # The final 14:15 plan leaves several executor/reprice opportunities before
    # regular-session entries stop at 14:40, 20 minutes before the close.
    entry_buffer_minutes: 20
    close_buffer_minutes: 5
    early_close_dates:
      "2026-11-27":
        regular_close_time: "12:00"
        extended_close_time: "12:15"
      "2026-12-24":
        regular_close_time: "12:00"
        extended_close_time: "12:15"
  basket:
    target_new_bpr_pct: 15
    hard_new_bpr_pct: 30
    min_marginal_score: 2
    max_new_positions_per_plan: 3
  max_bpr_per_order: 2500
  max_bpr_per_order_pct: 25
  max_bpr_per_order_by_structure:
    default: 500
    put_spread: 750
    call_spread: 750
    iron_condor: 500
    jade_lizard: 500
    call_calendar: 1200
    put_calendar: 1200
    call_diagonal: 1500
    put_diagonal: 1500
    long_call: 2500
    long_put: 2500
    short_strangle: 2500
    strangle: 2500
  max_bpr_per_underlying_pct: 55
  preflight_max_age_minutes: 10
  stale_entry_recovery:
    enabled: true
    max_rebuilds_per_execution: 1
    notification_mode: live
  entry_pricing:
    mode: liquidity_adjusted_mid       # liquidity_adjusted_mid | improved_mid | mid | disabled
    campaign:
      enabled: true                    # operator-approved 2026-08-21 canary
      initial_improvement_multiplier: 0.50
      allowance_pct_of_midpoint: 5.0
      allowance_max_fraction_of_improvement: 0.50
      # Hard ceiling only; midpoint %, improvement fraction, and economic headroom may bind lower.
      absolute_allowance_cap: 0.10
      valid_tick: 0.01
      absurd_bid_ask_pct: 3.0
    improvement_pct_of_spread: 10
    low_oi_improvement_pct_of_spread: 20
    very_low_oi_improvement_pct_of_spread: 35
    good_oi_threshold: 500
    low_oi_threshold: 100
    min_improvement: 0.01
    max_improvement: 0.10 # legacy fallback when a liquidity tier is unknown
    max_improvement_by_liquidity_tier:
      tight: 0.05
      normal: 0.10
      wide: 0.15
      very_wide: 0.25
      extreme: 0.35
    max_improvement_pct_of_premium: 40
    normal_bid_ask_pct: 0.30
    width_improvement_max_pct_of_spread: 45
    width_improvement_curve: 0.85
    apply_to_credit: true    # sell/credit entries ask for more credit than mid
    apply_to_debit: true     # buy/debit entries bid below mid
  entry_reprice:
    enabled: true
    after_minutes: 5
    max_reprices: 2
    improvement_multiplier: 0.5
    improvement_multipliers: [0.5, 0.0]
    expire_after_minutes: 30
    terminal_unfilled_receipt:
      # A broker-confirmed unfilled entry is fully retained in the order ledger
      # and daily report. It is routine autonomous workflow status, not an
      # operator-attention event.
      enabled: false
      mode: live
  exit_reprice:
    enabled: true
    after_minutes: 10
    max_reprices: 2
    step_multipliers: [0.5, 1.0]
    expire_after_minutes: 390
  liquidity_policy:
    low_oi_mode: price_through
    wide_bid_ask_mode: price_through
    absurd_bid_ask_pct: 3.0
  reconciliation:
    enabled: true
    broker_flat_confirmations_required: 2
    post_fill_position_grace_minutes: 20
    auto_retire_ghost_after_confirmations: true
    auto_local_repair_enabled: true
    block_management_on_open_issues: true
    order_reconciliation_enabled: true
    expire_stale_close_approvals: true
    stale_close_approval_minutes: 120
    stale_entry_approval_minutes: 120
    retire_stale_close_failures: true
  operator_review:
    enabled: true
    transport: lathi_bus # manual fallback; normal projection is Lathi's external-review bridge
    channel: telegram
    target: "5425926875"
    account: ""
    lathi_profile: kamandal-northstar
    lathi_mode: live
    expiry_minutes: 30
    max_pending_requests: 10
    use_inline_buttons: true
    text_fallback: true
  exit_pricing:
    profit_target_trigger_pct: 95
    min_profit_to_trigger: 5
    profit_floor_pct: 50
    require_fresh_quotes: true
    max_loss_action: close # review | close_when_confirmed | close
    max_loss_requires_confirmation: true # canonical adverse exits always use repeated valid observations
    default_max_loss_multiple_credit: 1.5 # backstop when a playbook has no max_loss_multiple
    default_max_loss_multiple_debit: 1.0
    short_strike_buffer_pct: 0
    loss_watch_max_leg_bid_ask_pct: 1.0
    loss_watch_confirmations_required: 2
    loss_watch_window_minutes: 120
  # Resting package targets are deliberately inert until separately activated.
  # They use the immutable lifecycle target and remain DAY orders at that exact
  # price; the ordinary exit reprice ladder does not apply.
  resting_profit:
    live_enabled: true
    shadow_enabled: false
  health:
    stale_close_order_minutes: 120
    # Keep the entry breaker fail-closed, but do not page until the first
    # 08:50 unified-plan account snapshot has had time to refresh.
    account_snapshot_refresh_grace_minutes: 20
    exit_pipeline_stalled_minutes: 20
    urgent_close_order_stale_minutes: 30
    block_entries_on_red: true
  telegram_approval:
    enabled: true
    transport: lathi_bus # lathi_bus | openclaw
    target: "5425926875"
    account: ""
    expiry_minutes: 8
    max_pending_requests: 3
  allow_same_day_exits: false
  allow_same_day_exits_after: 2026-06-06

volatility:
  metric: atm_30_45_mean_iv
  lookback_days: 252
  min_observations_for_percentile: 1
  missing_iv_policy: neutral   # strict | neutral
  provisional_percentile: 50
  dte_min: 30
  dte_max: 45
  sample_size: 12
  # capture-iv retains the near-ATM tenor rows below and writes one provider-
  # agnostic daily IV/IV Rank/IV percentile row per symbol. The afternoon run
  # replaces the morning daily row; Tastytrade is primary and these tenors are
  # the local fallback/evidence history.
  metrics:
    - metric: atm_30_45_mean_iv
      dte_min: 30
      dte_max: 45
      sample_size: 12
    - metric: atm_2_10_mean_iv   # short-dated (nearest weeklies) for the 2-7 DTE backtester
      dte_min: 2
      dte_max: 10
      sample_size: 8

execution:
  approval_mode: shadow_auto_top_plan
  order_type: limit
  time_in_force: DAY
  max_contracts_per_order: 1
  submit_to_broker: true

google_sheets:
  spreadsheet_id: 16Vjgrj80VDeTIGg0y60w4LHenZg7R-tGGvOyLNFdFsE
  credentials_file: ../public_api_trading_v3/config/google-credentials.json
  cache_dir: data/sheet_cache
  retry:
    attempts: 3
    base_delay_seconds: 1
    max_delay_seconds: 4
  tabs:
    universe: universe
    playbooks: playbooks
    daily_plan: daily_plan
    my_ideas: my_ideas

broker:
  active: public
  default_execution_venue: public_primary
  execution_venues:
    public_primary:
      broker: public
    tasty_primary:
      broker: tastytrade
  market_metrics_provider: tastytrade
  public:
    api_base_url: https://api.public.com
    auth_endpoint: https://api.public.com/userapiauthservice/personal/access-tokens
    session_file: config/public_session.json
    account_cache_file: config/public_account.json
    token_validity_minutes: 60
    api_requests_per_second: 5.0
    api_burst_limit: 5
    retry_attempts: 3
    retry_base_delay_seconds: 1.0
    require_preflight: true
    option_chain_start_dte: 21
    option_chain_end_dte: 140
    option_chain_max_expirations: 12
  tastytrade:
    api_base_url: https://api.tastyworks.com
    api_version: ""
    orders_api_version: "20260427"
    account_number: ""
    oauth_scopes: [read, trade]
    session_file: config/tastytrade_session.json
    account_cache_file: config/tastytrade_account.json

llm:
  provider: agent_broker
  model: ""
  codex_binary: ""
  codex_workdir: ""
  codex_timeout_seconds: 450

source_intelligence:
  correspondents:
    enabled: true
    mode: active_planner
    trial_root: ~/Documents/birdclaw
    output_dir: data/research/correspondent_signals
    observed_package_feed: data/research/correspondent_signals/observed_packages/latest.json
    active_ideas_dir: data/ideas/active
    since_hours: 336
    limit: 200
    market_questions:
      enabled: true
      evaluation_dir: data/research/market_questions
      request_dir: data/research/market_questions/requests
      cartographer_bin: ../market-cartographer/.venv/bin/market-cartographer
      provider: mala
      data_root: ../mala_v2/data
      max_symbols_per_request: 8
    profiles:
      - profile_id: greg_harmon
        source_profile_id: greg_harmon
        profile_path: config/correspondents/greg_harmon.yaml
        enabled: true
      - profile_id: mike_butler
        source_profile_id: mike_butler
        source_mode: observed_package
        enabled: true
  x_digest:
    latest_state_file: ~/.openclaw/workspace-main/state/x_daily_digest/latest.json
    trial_root: ~/Documents/birdclaw
    db_path: ""
    sources: bookmarks,timeline
    limit: 50
    since_hours: 96
  x_bookmarks:
    latest_state_file: ~/.openclaw/workspace-main/state/x_bookmark_shadow/latest.json
    trial_root: ~/Documents/birdclaw
    limit: 50

planner:
  expiry:
    monthly_single_name_bonus: true
    diagonal_calendar_dte_fallback:
      enabled: true
      max_near_gap_days: 7
      max_far_gap_days: 14
  vertical_width_search:
    enabled: false            # rollout flag — flip after one shadow day
    widths: [5.0, 7.5, 10.0]  # union'd with playbook.spread_width per playbook
    respect_bpr_cap: true     # never emit a construction over the per-order cap
