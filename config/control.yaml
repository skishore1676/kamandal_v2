runtime:
  mode: shadow                 # shadow | live
  trading_enabled: false
  halt: false

portfolio:
  target_max_bpr_utilization_pct: 90
  hard_max_bpr_utilization_pct: 90
  max_bpr_per_underlying_pct: 25
  max_positions: 5
  delta_bias: slightly_negative
  gamma_policy: record_and_research
  theta_policy: positive_theta_preferred
  vega_policy: record_only

shadow:
  account_size_override: 20000
  buying_power_override: 20000
  bpr_used_override: 0
  max_positions_override: 60
  idea_cooldown_days: 1
  match_gate_mode: permissive # strict | permissive
  candidate_filter_mode: warn   # strict | warn

live:
  allowed_structures: [long_call, long_put]
  entry_approval_mode: sheet_approval # sheet_approval | auto_top_plan | disabled
  exit_approval_mode: auto_rules      # sheet_approval | auto_rules | disabled
  auto_submit_entries: false
  auto_submit_exits: true
  match_gate_mode: strict
  candidate_filter_mode: strict
  max_new_positions_per_plan: 1
  max_new_plans_per_day: 1
  max_bpr_per_order: 1000
  max_bpr_per_underlying_pct: 50
  preflight_max_age_minutes: 10
  allow_same_day_exits: false

volatility:
  metric: atm_30_45_mean_iv
  lookback_days: 252
  min_observations_for_percentile: 1
  missing_iv_policy: neutral   # strict | neutral
  provisional_percentile: 50
  dte_min: 30
  dte_max: 45
  sample_size: 12

execution:
  approval_mode: shadow_auto_top_plan
  order_type: limit
  time_in_force: DAY
  max_contracts_per_order: 1
  submit_to_broker: true

google_sheets:
  spreadsheet_id: 16Vjgrj80VDeTIGg0y60w4LHenZg7R-tGGvOyLNFdFsE
  credentials_file: ../public_api_trading_v3/config/google-credentials.json
  cache_dir: data/sheet_cache
  tabs:
    universe: universe
    playbooks: playbooks
    daily_plan: daily_plan

broker:
  active: public
  public:
    api_base_url: https://api.public.com
    auth_endpoint: https://api.public.com/userapiauthservice/personal/access-tokens
    session_file: config/public_session.json
    account_cache_file: config/public_account.json
    token_validity_minutes: 60
    api_requests_per_second: 5.0
    api_burst_limit: 5
    require_preflight: true
    option_chain_start_dte: 21
    option_chain_end_dte: 90
    option_chain_max_expirations: 8

llm:
  provider: codex_cli
  model: ""
  codex_binary: ""
  codex_workdir: ""
  codex_timeout_seconds: 300

source_intelligence:
  x_digest:
    latest_state_file: ~/.openclaw/workspace-main/state/x_daily_digest/latest.json
    trial_root: ~/.openclaw/workspace-main/experiments/birdclaw-trial
    db_path: ""
    sources: bookmarks,timeline
    limit: 50
    since_hours: 96
  x_bookmarks:
    latest_state_file: ~/.openclaw/workspace-main/state/x_bookmark_shadow/latest.json
    trial_root: ~/.openclaw/workspace-main/experiments/birdclaw-trial
    limit: 50
