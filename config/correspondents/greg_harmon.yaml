schema: kamandal.correspondent_profile.v1
profile_id: greg_harmon
source_author_handles: [harmongreg]
version: "3"
source_profile_id: greg_harmon
interpretation_posture: inference_allowed

episode_interpreter:
  version: "1"
  max_history_episodes: 20
  max_records_per_turn: 20
  scale_in_creates_idea: true
  open_confirmation_regex: "\\btook\\b.*\\btrade idea\\s*#?\\s*\\d+"
  symbol_aliases:
    Broadcom: AVGO
    Dell: DELL
    DocuSign: DOCU
    lululemon: LULU
    Palo Alto Networks: PANW
  structure_aliases:
    call_vertical: call_spread
    bull_call_spread: call_spread
    put_vertical: put_spread
    strangle: short_strangle
    call_spread_short_put: bull_call_spread_with_short_put
    call_calendar_short_put: call_calendar_with_short_put
    call_diagonal_short_put: call_diagonal_with_short_put
    call_diagonal_plus_short_put: call_diagonal_with_short_put
    call_spread_with_short_put: bull_call_spread_with_short_put
    call_spread_plus_short_put: bull_call_spread_with_short_put
    call_calendar_plus_short_put: call_calendar_with_short_put
  action_overrides:
    - {id: bought_to_close, regex: "\\bbought to close\\b", action: close}
    - {id: expires_then_close, regex: "\\bputs? expire\\b.*\\b(?:buy|sell) to close\\b", action: adjust}
    - {id: explicit_exit_instruction, regex: "\\b(?:buy|sell) to close\\b", action: adjust}
    - {id: roll_management, regex: "\\b(?:will )?(?:need to )?roll(?:ed|ing)?\\b", action: roll}
    - {id: looks_to_expire, regex: "\\blook(?:s)? to expire\\b", action: hold}
    - {id: added, regex: "\\b(?:also )?added\\b", action: scale_in}
  composite_structure_rules:
    - id: call_diagonal_with_short_put
      regex: "\\bcall diagonals?\\b.*\\b(?:sell|selling|short)\\b.*\\bput\\b"
      component_structures: [call_diagonal, short_put]
      structure_hint: call_diagonal_with_short_put
    - id: call_calendar_with_short_put
      regex: "\\bcall calendar\\b.*\\b(?:sell|selling|short)\\b.*\\bput\\b"
      component_structures: [call_calendar, short_put]
      structure_hint: call_calendar_with_short_put
    - id: bull_call_spread_with_short_put
      regex: "\\bcall spread\\b.*\\b(?:sell|selling|short)\\b.*\\bput\\b"
      component_structures: [call_spread, short_put]
      structure_hint: bull_call_spread_with_short_put
  source_guidance: |
    Greg publishes recurring earnings templates, directional theses, and terse
    trade-journal shorthand. Premium Earnings announcements deterministically
    expand to Ideas 1 through 4 for every named symbol; they are ideas, not exact
    packages. A later "took idea" post confirms a prior source opportunity and
    must link to it rather than create a duplicate. "Looks to expire", close,
    trim, roll, and management language are follow-ups, never fresh entries.
    Standard shorthand such as call-spread risk reversal and broken-wing call
    fly may supply normalized leg ratios when every strike and expiration is
    explicit. Do not fetch or invent inaccessible article terms or bonus ideas.
    In a standalone ticker + expiration + option-structure shorthand, with no
    close/roll/hold or quoted-history language, Greg is proposing an opening
    opportunity even when he omits a verb such as "bought". Emit its idea;
    discovery is reserved for non-trading capability or product announcements.
    A bare month in Greg's shorthand means that month's standard monthly
    options. Keep unresolved exact calendar dates in the exact-package blocker;
    they do not invalidate an independently clear directional idea. Never
    invent an expiration day or carry old quoted entry terms into a new entry.

families:
  weekly_ideas:
    mode: chart_watch
    direction: neutral
    max_age_hours: 240
    planner:
      supported: true
      allowed_structures_by_direction:
        bullish: [call_spread, call_diagonal]
        bearish: [put_diagonal]
      thesis_tags: [correspondent_weekly, breakout, momentum]
      horizon_days: 30

  earnings_idea: &greg_earnings_templates
    mode: numbered_template
    max_age_hours: 36
    default_idea_number: 4
    idea_number_map:
      "1":
        strategy_family: put_ratio_1x2
        direction: bearish
        planner_supported: false
        allowed_structures: []
      "2":
        strategy_family: bull_call_spread_with_short_put
        direction: bullish
        planner_supported: false
        allowed_structures: []
      "3":
        strategy_family: call_calendar_with_short_put
        direction: bullish
        planner_supported: false
        allowed_structures: []
      "4":
        strategy_family: short_strangle
        direction: neutral
        planner_supported: true
        allowed_structures: [short_strangle]
    planner:
      thesis_tags: [correspondent_earnings, earnings, volatility]
      horizon_days: 7

  earnings_bundle:
    <<: *greg_earnings_templates
    bundle_idea_numbers: [1, 2, 3, 4]
    bundle_implies_enter: true

  trade_journal:
    mode: trade_journal
    max_age_hours: 24
    planner:
      supported: true
      map_directional_to_planner: true
      allowed_structures_by_direction:
        bullish: [call_spread, call_diagonal]
        bearish: [put_diagonal]
      thesis_tags: [correspondent_journal, source_trade]
      horizon_days: 30

strategy_rules:
  - {id: iron_condor, regex: "\\biron condor\\b", strategy_family: iron_condor, direction: neutral, allowed_structures: [iron_condor]}
  - {id: call_calendar, regex: "\\bcall calendars?\\b|\\bcalendar calls?\\b", strategy_family: call_calendar, direction: bullish, allowed_structures: [call_calendar]}
  - {id: put_calendar, regex: "\\bput calendars?\\b|\\bcalendar puts?\\b", strategy_family: put_calendar, direction: bearish, allowed_structures: [put_calendar]}
  - {id: call_diagonal, regex: "\\bcall diagonals?\\b|\\bdiagonal calls?\\b", strategy_family: call_diagonal, direction: bullish, allowed_structures: [call_diagonal]}
  - {id: put_diagonal, regex: "\\bput diagonals?\\b|\\bdiagonal puts?\\b", strategy_family: put_diagonal, direction: bearish, allowed_structures: [put_diagonal]}
  - {id: short_strangle, regex: "\\bstrangle\\b", strategy_family: short_strangle, direction: neutral, allowed_structures: [short_strangle]}
  - {id: short_put, regex: "\\b(?:sell|selling|short)\\b.*\\bput\\b", strategy_family: short_put, direction: bullish, allowed_structures: []}
  - {id: call_spread_risk_reversal, regex: "\\bcall spread risk reversals?\\b", strategy_family: call_spread_risk_reversal, direction: bullish, allowed_structures: []}
  - {id: broken_wing_call_fly, regex: "\\b(?:bw|broken[- ]wing) call fl(?:y|ys|ies)\\b", strategy_family: broken_wing_call_fly, direction: bullish, allowed_structures: []}
  - id: call_spread
    regex: "\\bcall (?:vertical|spread)\\b"
    strategy_family: call_spread
    direction: bullish
    allowed_structures: [call_spread]
    direction_rules:
      - {id: bought_call_spread, regex: "\\b(?:bought|buying|long)\\b", direction: bullish}
      - {id: sold_call_spread, regex: "\\b(?:sold|selling|short)\\b", direction: bearish}
  - id: put_spread
    regex: "\\bput (?:vertical|spread)\\b"
    strategy_family: put_spread
    direction: bearish
    allowed_structures: [put_spread]
    direction_rules:
      - {id: bought_put_spread, regex: "\\b(?:bought|buying|long)\\b", direction: bearish}
      - {id: sold_put_spread, regex: "\\b(?:sold|selling|short)\\b", direction: bullish}
  - {id: long_call, regex: "\\bb(?:uy|ought|uying) (?:the )?(?:[A-Z]+ )?.*\\bcall(?:s)?\\b", strategy_family: long_call, direction: bullish, allowed_structures: [long_call]}
  - {id: long_put, regex: "\\bb(?:uy|ought|uying) (?:the )?(?:[A-Z]+ )?.*\\bput(?:s)?\\b", strategy_family: long_put, direction: bearish, allowed_structures: [long_put]}

journal_actions:
  - {action: close, regex: "\\b(?:closed|covered|took off|exited|sold (?:the )?remaining|all out)\\b"}
  - {action: adjust, regex: "\\b(?:rolled|adjusted|added|trimmed|reduced|sold half|took half|half off)\\b"}
  - {action: open, regex: "\\b(?:bought|sold|buying|selling|entered|opened|took)\\b"}
