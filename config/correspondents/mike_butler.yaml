schema: kamandal.correspondent_profile.v1
profile_id: mike_butler
version: "1"
source_profile_id: mike_butler
interpretation_posture: explicit_only

episode_interpreter:
  version: "1"
  max_history_episodes: 30
  max_records_per_turn: 20
  structure_aliases:
    strangle: short_strangle
    calendar: call_calendar
    butterfly: butterfly
    crab: call_crab
  source_guidance: |
    Mike often puts exact option legs in attached screenshots and combines
    several actions in one post. Treat each symbol/action/package as a separate
    event. Read cached public images together with the text. Opens may produce
    both a thesis idea and an exact package, sharing one opportunity. Closes,
    partial closes, rolls, adjustments, and holds must link to prior source
    events and never become new entries. If an image or prior event is missing,
    park with needs_media or needs_history. Do not coerce butterflies, crabs,
    futures options, or other unsupported shapes into a calendar or diagonal.

# The deployed narrow translator still uses these family modes. The source
# episode compiler supersedes the old one-post/one-route assumption and groups
# idea/exact projections so they cannot create duplicate exposure.
families:
  observed_package_open: {mode: ignore, max_age_hours: 24}
  observed_package_close: {mode: ignore}
  observed_package_roll: {mode: ignore}
  observed_package_adjust: {mode: ignore}
  trade_idea:
    mode: trade_journal
    max_age_hours: 24
    planner:
      supported: true
      map_directional_to_planner: true
      allowed_structures_by_direction:
        bullish: [call_spread, call_calendar, call_diagonal]
        bearish: [put_calendar, put_diagonal]
      thesis_tags: [correspondent_mike, source_trade]
      horizon_days: 30
  trade_journal:
    mode: trade_journal
    max_age_hours: 24
    planner:
      supported: true
      map_directional_to_planner: true
      allowed_structures_by_direction:
        bullish: [call_spread, call_calendar, call_diagonal]
        bearish: [put_calendar, put_diagonal]
      thesis_tags: [correspondent_mike, source_trade]
      horizon_days: 30
  market_commentary: {mode: ignore}

strategy_rules:
  - {id: call_crab, regex: "\\bcall crab\\b|\\bcrab trade\\b", strategy_family: call_crab, direction: bullish, allowed_structures: []}
  - {id: butterfly, regex: "\\bbutterfl(?:y|ies)\\b", strategy_family: butterfly, direction: neutral, allowed_structures: []}
  - {id: call_calendar, regex: "\\bcall calendars?\\b|\\bcalendar calls?\\b", strategy_family: call_calendar, direction: bullish, allowed_structures: [call_calendar]}
  - {id: put_calendar, regex: "\\bput calendars?\\b|\\bcalendar puts?\\b", strategy_family: put_calendar, direction: bearish, allowed_structures: [put_calendar]}
  - {id: call_diagonal, regex: "\\bcall diagonals?\\b|\\bdiagonal calls?\\b", strategy_family: call_diagonal, direction: bullish, allowed_structures: [call_diagonal]}
  - {id: put_diagonal, regex: "\\bput diagonals?\\b|\\bdiagonal puts?\\b", strategy_family: put_diagonal, direction: bearish, allowed_structures: [put_diagonal]}
  - id: call_spread
    regex: "\\bcall (?:vertical|spread)\\b"
    strategy_family: call_spread
    direction: bullish
    allowed_structures: [call_spread]
  - id: put_spread
    regex: "\\bput (?:vertical|spread)\\b"
    strategy_family: put_spread
    direction: bearish
    allowed_structures: [put_spread]

journal_actions:
  - {action: close, regex: "\\b(?:closed|covered|took off|exited|all out)\\b"}
  - {action: adjust, regex: "\\b(?:rolled|adjusted|added|trimmed|reduced|half off)\\b"}
  - {action: open, regex: "\\b(?:bought|sold|buying|selling|entered|opened|took)\\b"}
