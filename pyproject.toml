[project]
name = "kamandal-v2"
version = "0.1.0"
description = "Local-first multileg options portfolio planning and management cockpit."
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.40.0",
  "gspread>=6.0.0",
  "pydantic>=2.11.0",
  "PyYAML>=6.0.2",
  "requests>=2.31.0",
]

[project.scripts]
kamandal = "kamandal_v2.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
